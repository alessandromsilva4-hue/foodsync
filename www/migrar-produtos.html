<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lotrix - Migração de Produtos</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: #f5f5f5;
        }

        .box {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,.1);
        }

        button {
            padding: 14px 22px;
            border: none;
            border-radius: 8px;
            background: #15803d;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: .9;
        }

        #resultado {
            margin-top: 25px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 8px;
        }

    </style>

</head>

<body>

    <div class="box">

        <h1>Lotrix</h1>

        <h2>Migração de Produtos</h2>

        <p>
            Esta ferramenta transforma os produtos antigos
            que possuem o campo <strong>empresas</strong>
            para o novo modelo multiempresa com
            <strong>idEmpresa</strong>.
        </p>

        <p>
            ⚠️ Execute esta ferramenta apenas uma vez.
        </p>

        <button id="iniciarMigracao">
            Iniciar Migração
        </button>

        <div id="resultado">
            Aguardando início...
        </div>

    </div>

    <script
        type="module"
        src="./js/migrar-produtos.js"
    ></script>

</body>

</html>
